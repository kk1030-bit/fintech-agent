    <text x="56" y="335">3034 聯詠（同業）</text><text x="250" y="335">2026Q2</text>
    <rect x="40" y="354" width="1120" height="48" fill="#f3f3ef" stroke="#d7e2df" stroke-dasharray="6 4"/>
    <text x="56" y="383">2330 台積電（產業參照・不入平均）</text>

    <rect x="40" y="402" width="1120" height="44" fill="#eef6f3" stroke="#d7e2df"/>
    <text x="56" y="429">同業平均（僅 2379、3034）</text><text x="460" y="429">平均</text><text x="580" y="429">平均</text>
