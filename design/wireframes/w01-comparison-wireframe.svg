    <text x="460" y="239">數值</text><text x="580" y="239">數值</text><text x="680" y="239">數值 / NA+原因</text><text x="820" y="239">數值</text><text x="920" y="239">±15% 狀態</text>
    <rect x="1036" y="224" width="100" height="24" rx="12" fill="#e6f1f6"/><text x="1050" y="241" fill="#10445e">2 個來源 ›</text>

    <rect x="40" y="258" width="1120" height="48" fill="#fff" stroke="#d7e2df"/>
