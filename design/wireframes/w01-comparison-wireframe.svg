  <text x="60" y="524" font-size="13" fill="#5f7378">evidence_version_id、原文片段、來源 URL、available_at、</text>
  <text x="60" y="546" font-size="13" fill="#5f7378">content_hash 與「hash 是否吻合」、synthetic_fixture</text>
  <text x="60" y="576" font-size="13" fill="#5f7378">缺值顯示 NA＋原因，不顯示 0；不同財報期要標出</text>

  <rect x="620" y="466" width="540" height="200" rx="8" fill="#fff" stroke="#d7e2df"/>
